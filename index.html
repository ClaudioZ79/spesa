<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Spesa">
<meta name="theme-color" content="#1f6f78">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<title>Spesa</title>
<style>
:root{--bg:#eef2f3;--panel:#fff;--ink:#1b2528;--muted:#5b686c;--line:#d5dde0;--accent:#1f6f78;--dis:#1f6f78;--dis-bg:#e1f1f2;--cas:#8a5a00;--cas-bg:#fff3d6;--bad:#b3261e;color-scheme:light dark}
@media (prefers-color-scheme:dark){:root{--bg:#121819;--panel:#1b2325;--ink:#e6eeef;--muted:#9aa9ad;--line:#2c3a3d;--accent:#6cc3cc;--dis:#6cc3cc;--dis-bg:#17383c;--cas:#f2c360;--cas-bg:#352a12;--bad:#ff8a80}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",system-ui,sans-serif;padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom)}
.wrap{max-width:640px;margin:0 auto;padding:20px 16px 80px;display:grid;gap:16px}
header{display:flex;align-items:baseline;justify-content:space-between;gap:12px}
h1{margin:0;font-size:28px;letter-spacing:-.01em}
.count{font-size:15px;color:var(--muted);font-variant-numeric:tabular-nums}
.card{background:var(--panel);border:1px solid var(--line);border-radius:12px;overflow:hidden}
.src{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:10px 14px;border-bottom:1px solid var(--line);font-size:14px}
.src:last-child{border-bottom:0}
.src .st{color:var(--muted)}
.src .st.ok{color:var(--accent)}
.src .st.err{color:var(--bad)}
button{font:inherit;color:inherit;cursor:pointer}
.btn{background:var(--accent);color:var(--panel);border:0;border-radius:8px;padding:0 14px;min-height:40px;font-weight:700}
.btn.ghost{background:transparent;color:var(--accent);border:1.5px solid var(--accent)}
.btn.small{min-height:32px;padding:0 10px;font-size:13px}
ul{list-style:none;margin:0;padding:0}
li{display:flex;align-items:center;gap:12px;padding:12px 14px;border-top:1px solid var(--line)}
li:first-child{border-top:0}
li input{width:24px;height:24px;flex:none;accent-color:var(--accent)}
li .body{flex:1;min-width:0}
li .nm{font-weight:700;overflow-wrap:anywhere}
li.done .nm{text-decoration:line-through;color:var(--muted)}
.meta{display:flex;flex-wrap:wrap;gap:4px 6px;margin-top:3px;font-size:13px;color:var(--muted)}
.tag{font-size:11px;font-weight:700;padding:1px 8px;border-radius:999px}
.tag.dis{background:var(--dis-bg);color:var(--dis)}
.tag.cas{background:var(--cas-bg);color:var(--cas)}
.empty{padding:22px 14px;color:var(--muted);text-align:center}
.actions{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.actions label{font-size:14px;color:var(--muted);display:flex;gap:6px;align-items:center;margin-left:auto}
.actions label input{width:18px;height:18px;accent-color:var(--accent)}
textarea{width:100%;min-height:110px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--ink);font:inherit;padding:10px}
.note{font-size:13px;color:var(--muted)}
.add{display:flex;flex-wrap:wrap;gap:8px;padding:12px 14px;align-items:center}
.add input[type=text]{flex:1 1 100%;min-height:44px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--ink);font:inherit;padding:0 12px}
.dove{display:flex;flex:1;gap:6px}
.dove label{flex:1}
.dove input{position:absolute;opacity:0;pointer-events:none}
.dove span{display:block;text-align:center;padding:8px 10px;border:1.5px solid var(--line);border-radius:8px;font-weight:700;color:var(--muted);cursor:pointer}
.dove input:checked+span{border-color:var(--accent);color:var(--accent);background:var(--dis-bg)}
.dove input:focus-visible+span{outline:2px solid var(--accent);outline-offset:2px}
.qty{display:flex;align-items:center;gap:2px;flex:none}
.qty button{width:34px;height:34px;border-radius:50%;border:1.5px solid var(--accent);background:transparent;color:var(--accent);font-size:20px;line-height:1;padding:0}
.qty button:disabled{opacity:.35;cursor:default}
.qty output{min-width:28px;text-align:center;font-weight:700;font-variant-numeric:tabular-nums}
</style>
</head>
<body>
<div class="wrap">
  <header><h1>Spesa</h1><span class="count" id="count"></span></header>

  <div class="card" id="fonti" aria-label="Stato delle liste collegate"></div>

  <div class="actions">
    <button class="btn" id="copia" type="button">Copia per Note</button>
    <label><input type="checkbox" id="nascondi"> Nascondi già presi</label>
  </div>
  <textarea id="ta" readonly hidden aria-label="Testo da copiare"></textarea>

  <form class="card add" id="form" autocomplete="off">
    <input id="nome" type="text" maxlength="80" placeholder="Aggiungi un prodotto…" aria-label="Nome del prodotto" enterkeyhint="done">
    <div class="dove" role="radiogroup" aria-label="Dove aggiungerlo">
      <label><input type="radio" name="dove" value="casa" checked><span>Casa</span></label>
      <label><input type="radio" name="dove" value="dispensa"><span>Dispensa</span></label>
    </div>
    <button class="btn" type="submit">Aggiungi</button>
  </form>
  <p class="note" id="esito" role="status" hidden></p>

  <div class="card"><ul id="lista"></ul></div>
  <p class="note" id="avviso" hidden></p>
  <p class="note">Unisce la lista della Dispensa e la lista della spesa di Casa. Gli articoli presenti in entrambe compaiono una volta sola. La spunta si salva nell'app di origine; spuntare un articolo di Casa ne aumenta anche la scorta, come fa Casa.</p>
</div>

<script src="https://cdn.jsdelivr.net/npm/firebase@10.12.5/firebase-app-compat.js"></script>
<script src="https://cdn.jsdelivr.net/npm/firebase@10.12.5/firebase-firestore-compat.js"></script>
<script src="https://cdn.jsdelivr.net/npm/firebase@10.12.5/firebase-auth-compat.js"></script>
<script>
(() => {
  // Configurazioni pubbliche dei due progetti Firebase: la protezione sono le regole dei database.
  const SOGLIA_CASA = 2;
  const EMAIL = ['utente1@example.com', 'utente2@example.com'];
  const FONTI = {
    dispensa: { nome: 'Dispensa', cfg: {
      apiKey: 'AIzaSyAgrmFh3Rdh4i3TubltgfY50h-Vw9SyV-w', authDomain: 'dispensa-e3c52.firebaseapp.com',
      projectId: 'dispensa-e3c52', storageBucket: 'dispensa-e3c52.firebasestorage.app',
      messagingSenderId: '187334497556', appId: '1:187334497556:web:26e56d2c26cae6e43e1e01' } },
    casa: { nome: 'Casa', cfg: {
      apiKey: 'AIzaSyBESayIo0hrpfAHWcX0yCHijq7vEx7Qk_0', authDomain: 'casa-511922.firebaseapp.com',
      projectId: 'casa-511922', storageBucket: 'casa-511922.firebasestorage.app',
      messagingSenderId: '144660060564', appId: '1:144660060564:web:8590c8df572290d85f5781' } },
  };

  const $ = id => document.getElementById(id);
  const norm = s => String(s || '').trim().toLowerCase();
  const fmtN = n => String(Math.round(n * 100) / 100).replace('.', ',');
  const stato = { dispensa: { s: 'carico', msg: '' }, casa: { s: 'carico', msg: '' } };
  let spesaDis = [], spesaCasa = [], scorteCasa = [];
  let nascondi = false;
  let dbDis = null, dbCasa = null;

  try { nascondi = localStorage.getItem('spesa.nascondi') === '1'; } catch (e) {}
  $('nascondi').checked = nascondi;

  const num = (v, d) => { const n = parseInt(v, 10); return Number.isFinite(n) ? n : d; };

  // Voci della lista di Casa: quelle da comprare e quelle già comprate; le "tolte" a mano restano nascoste.
  // Per ogni nome si tiene una sola voce: quella ancora aperta, altrimenti l'ultima comprata.
  function vociCasa() {
    const per = new Map();
    spesaCasa.filter(x => x.comprato || !x.tolto).forEach(x => {
      const k = norm(x.nome), v = per.get(k);
      if (!v || (v.comprato && !x.comprato) || (v.comprato === x.comprato && String(x.creataIl) > String(v.creataIl))) per.set(k, x);
    });
    return per;
  }

  // Unisce le due liste in una sola, senza doppioni (stesso nome = stessa riga).
  function righe() {
    const mappa = new Map();
    spesaDis.filter(s => !s.nascosto).forEach(s => {
      mappa.set(norm(s.nome), { nome: s.nome, dis: s, cas: null });
    });
    vociCasa().forEach((x, k) => {
      const r = mappa.get(k);
      if (r) r.cas = x; else mappa.set(k, { nome: x.nome, dis: null, cas: x });
    });
    const out = [...mappa.values()].map(r => {
      // "preso" vale solo se tutte le fonti presenti lo dicono
      const flags = [];
      if (r.dis) flags.push(!!r.dis.preso);
      if (r.cas) flags.push(!!r.cas.comprato);
      r.preso = flags.every(Boolean);
      return r;
    });
    return out.sort((a, b) => (a.preso - b.preso) || a.nome.localeCompare(b.nome, 'it'));
  }

  // Scorte basse che in Casa non hanno ancora una voce: compaiono quando si apre l'app Casa.
  function scorteSenzaVoce() {
    const conVoce = new Set(spesaCasa.map(x => x.scortaId).filter(Boolean));
    return scorteCasa.filter(s => num(s.quantita, 0) <= SOGLIA_CASA && !conVoce.has(s.id));
  }

  // Quantità da comprare della riga: quella della Dispensa se c'è, altrimenti quella di Casa.
  function qtaRiga(r) {
    if (r.dis) return typeof r.dis.n === 'number' && r.dis.n > 0 ? r.dis.n : 1;
    return Math.max(1, num(r.cas.quantita, 1));
  }
  const unitaRiga = r => (r.dis && r.dis.unita) || (r.cas && r.cas.unita) || '';

  function dettaglio(r) {
    const p = [];
    if (unitaRiga(r)) p.push(unitaRiga(r));
    if (r.cas) {
      const s = scorteCasa.find(y => y.id === r.cas.scortaId);
      if (s) p.push('in casa: ' + num(s.quantita, 0));
    }
    return p;
  }

  function render() {
    const tutte = righe();
    const aperte = tutte.filter(r => !r.preso).length;
    $('count').textContent = aperte + (aperte === 1 ? ' da comprare' : ' da comprare');
    const ul = $('lista'); ul.replaceChildren();
    const mostra = nascondi ? tutte.filter(r => !r.preso) : tutte;
    if (!mostra.length) {
      const li = document.createElement('li'); li.className = 'empty'; li.style.display = 'block';
      li.textContent = (stato.dispensa.s === 'ok' || stato.casa.s === 'ok') ? 'Niente da comprare per ora.' : 'Accedi per vedere le liste.';
      ul.appendChild(li);
    }
    mostra.forEach(r => {
      const li = document.createElement('li'); if (r.preso) li.className = 'done';
      const cb = document.createElement('input'); cb.type = 'checkbox'; cb.checked = r.preso;
      cb.setAttribute('aria-label', 'Preso: ' + r.nome);
      cb.addEventListener('change', () => segna(r, cb.checked));
      const body = document.createElement('div'); body.className = 'body';
      const nm = document.createElement('div'); nm.className = 'nm'; nm.textContent = r.nome;
      const meta = document.createElement('div'); meta.className = 'meta';
      if (r.dis) { const t = document.createElement('span'); t.className = 'tag dis'; t.textContent = 'Dispensa'; meta.appendChild(t); }
      if (r.cas) { const t = document.createElement('span'); t.className = 'tag cas'; t.textContent = 'Casa'; meta.appendChild(t); }
      dettaglio(r).forEach(x => { const s = document.createElement('span'); s.textContent = x; meta.appendChild(s); });
      const q = qtaRiga(r);
      const qty = document.createElement('div'); qty.className = 'qty';
      const meno = document.createElement('button'); meno.type = 'button'; meno.textContent = '−';
      meno.setAttribute('aria-label', 'Diminuisci ' + r.nome); meno.disabled = r.preso || q <= 1;
      meno.addEventListener('click', () => cambiaQta(r, -1));
      const out = document.createElement('output'); out.textContent = fmtN(q);
      const piu = document.createElement('button'); piu.type = 'button'; piu.textContent = '+';
      piu.setAttribute('aria-label', 'Aumenta ' + r.nome); piu.disabled = r.preso;
      piu.addEventListener('click', () => cambiaQta(r, 1));
      qty.append(meno, out, piu);
      body.append(nm, meta); li.append(cb, body, qty); ul.appendChild(li);
    });
    const senza = stato.casa.s === 'ok' ? scorteSenzaVoce() : [];
    $('avviso').hidden = !senza.length;
    if (senza.length) $('avviso').textContent = 'Scorte basse non ancora in lista (' + senza.map(s => s.nome).join(', ') + '): apri l\'app Casa per aggiungerle.';
    renderFonti();
  }

  const erroreSalva = () => { $('count').textContent = 'Non sono riuscito a salvare la spunta'; };

  // Come in Casa: comprare una voce nata da una scorta ne aumenta la quantità, togliere la spunta la riporta indietro.
  function segnaCasa(x, comprato) {
    if (!dbCasa || x.comprato === comprato) return;
    const rifV = dbCasa.collection('spesa').doc(x.id);
    const rifS = x.scortaId ? dbCasa.collection('scorte').doc(x.scortaId) : null;
    x.comprato = comprato;
    dbCasa.runTransaction(async t => {
      const s = rifS ? await t.get(rifS) : null;
      t.update(rifV, { comprato });
      if (s && s.exists) t.update(rifS, { quantita: Math.max(0, num(s.data().quantita, 0) + (comprato ? 1 : -1) * num(x.quantita, 1)) });
    }).catch(erroreSalva);
  }

  // Cambia la quantità da comprare: si scrive in tutte le fonti della riga. In Casa auto:false, come fa Casa
  // quando la quantità la scegli tu (altrimenti seguirebbe da sola la scorta).
  function cambiaQta(r, delta) {
    const q = Math.max(1, Math.round((qtaRiga(r) + delta) * 100) / 100);
    if (q === qtaRiga(r)) return;
    if (r.dis) {
      r.dis.n = q;
      if (dbDis) dbDis.collection('spesa').doc(r.dis.id).update({ n: q }).catch(erroreSalva);
    }
    if (r.cas && !r.cas.comprato) {
      r.cas.quantita = q; r.cas.auto = false;
      if (dbCasa) dbCasa.collection('spesa').doc(r.cas.id).update({ quantita: q, auto: false }).catch(erroreSalva);
    }
    render();
  }

  let esitoTimer = null;
  function esito(msg) {
    const e = $('esito'); e.textContent = msg; e.hidden = !msg;
    clearTimeout(esitoTimer); if (msg) esitoTimer = setTimeout(() => esito(''), 4000);
  }

  const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 7);
  const adesso = () => new Date().toISOString().replace(/\.\d{3}Z$/, 'Z');

  // Aggiunge un prodotto (1 pezzo) alla lista di Casa o della Dispensa, senza doppioni: se c'è già, ne aggiunge uno.
  async function aggiungi(nome, dove) {
    const k = norm(nome);
    if (dove === 'dispensa') {
      if (!dbDis) throw new Error('Accedi prima alla Dispensa');
      const col = dbDis.collection('spesa');
      const es = spesaDis.find(s => norm(s.nome) === k);
      if (es && !es.nascosto) return col.doc(es.id).update({ n: (typeof es.n === 'number' && es.n > 0 ? es.n : 1) + 1 });
      if (es) return col.doc(es.id).update({ nascosto: false, preso: false, n: 1 });
      return col.add({ nome, n: 1, unita: 'pz', tipo: '', aggiunto: new Date().toISOString(), preso: false });
    }
    if (!dbCasa) throw new Error('Accedi prima a Casa');
    const col = dbCasa.collection('spesa');
    const scorta = scorteCasa.find(s => norm(s.nome) === k);
    const es = spesaCasa.find(x => !x.comprato && (scorta ? x.scortaId === scorta.id : norm(x.nome) === k));
    if (es && es.tolto) return col.doc(es.id).update({ tolto: firebase.firestore.FieldValue.delete(), quantita: 1, auto: false });
    if (es) return col.doc(es.id).update({ quantita: Math.max(1, num(es.quantita, 1)) + 1, auto: false });
    const id = uid();
    return col.doc(id).set({ id, nome: scorta ? scorta.nome : nome, quantita: 1, unita: scorta ? (scorta.unita || '') : '',
      comprato: false, scortaId: scorta ? scorta.id : '', creataIl: adesso() });
  }

  try { const d = localStorage.getItem('spesa.dove'); if (d) document.querySelector('input[name=dove][value=' + d + ']').checked = true; } catch (e) {}
  $('form').addEventListener('submit', async e => {
    e.preventDefault();
    const nome = $('nome').value.trim();
    const dove = document.querySelector('input[name=dove]:checked').value;
    if (!nome) { $('nome').focus(); return; }
    try { localStorage.setItem('spesa.dove', dove); } catch (x) {}
    try {
      await aggiungi(nome, dove);
      $('nome').value = '';
      esito('Aggiunto a ' + FONTI[dove].nome + ': ' + nome);
    } catch (err) {
      esito(err && err.code === 'permission-denied' ? 'Non ho il permesso di scrivere in ' + FONTI[dove].nome : (err && err.message) || 'Non sono riuscito ad aggiungerlo');
    }
  });

  function segna(r, preso) {
    if (r.cas) segnaCasa(r.cas, preso);
    if (r.dis) {
      r.dis.preso = preso;
      if (dbDis) dbDis.collection('spesa').doc(r.dis.id).update({ preso }).catch(erroreSalva);
    }
    render();
  }

  function renderFonti() {
    const box = $('fonti'); box.replaceChildren();
    Object.keys(FONTI).forEach(k => {
      const st = stato[k];
      const row = document.createElement('div'); row.className = 'src';
      const l = document.createElement('span'); l.textContent = FONTI[k].nome;
      const r = document.createElement('span');
      if (st.s === 'sconnesso') {
        const b = document.createElement('button'); b.className = 'btn small'; b.textContent = 'Accedi con Google';
        b.addEventListener('click', () => accedi(k)); r.appendChild(b);
      } else {
        r.className = 'st ' + (st.s === 'ok' ? 'ok' : st.s === 'errore' ? 'err' : '');
        r.textContent = st.s === 'ok' ? 'collegata' : st.s === 'carico' ? 'collego…' : st.msg || 'errore';
      }
      row.append(l, r); box.appendChild(row);
    });
  }

  function accedi(k) {
    const app = firebase.app(k);
    app.auth().signInWithPopup(new firebase.auth.GoogleAuthProvider()).catch(e => {
      stato[k] = { s: 'errore', msg: 'Accesso non riuscito' }; renderFonti();
    });
  }

  function avvia(k) {
    let app;
    try { app = firebase.initializeApp(FONTI[k].cfg, k); }
    catch (e) { stato[k] = { s: 'errore', msg: 'Non disponibile' }; return; }
    const auth = app.auth();
    let off = [];
    auth.onAuthStateChanged(user => {
      off.forEach(f => f()); off = [];
      if (!user) {
        stato[k] = { s: 'sconnesso', msg: '' };
        if (k === 'dispensa') { spesaDis = []; dbDis = null; } else { spesaCasa = []; scorteCasa = []; dbCasa = null; }
        render(); return;
      }
      if (!EMAIL.includes(user.email)) {
        stato[k] = { s: 'errore', msg: 'Account non autorizzato' }; auth.signOut(); render(); return;
      }
      const db = app.firestore();
      if (k === 'dispensa') dbDis = db; else dbCasa = db;
      // Dispensa: la sua lista. Casa: la lista della spesa e le scorte (servono per aggiornare la quantità).
      const cols = k === 'dispensa' ? ['spesa'] : ['spesa', 'scorte'];
      cols.forEach(col => {
        off.push(db.collection(col).onSnapshot(snap => {
          const dati = snap.docs.map(d => Object.assign({ id: d.id }, d.data()));
          if (k === 'dispensa') spesaDis = dati;
          else if (col === 'spesa') spesaCasa = dati;
          else scorteCasa = dati;
          stato[k] = { s: 'ok', msg: '' }; render();
        }, () => { stato[k] = { s: 'errore', msg: 'Connessione persa' }; render(); }));
      });
    });
  }

  $('nascondi').addEventListener('change', e => {
    nascondi = e.target.checked;
    try { localStorage.setItem('spesa.nascondi', nascondi ? '1' : '0'); } catch (x) {}
    render();
  });

  $('copia').addEventListener('click', async () => {
    const testo = 'Lista della spesa\n' + righe().filter(r => !r.preso).map(r => {
      const u = unitaRiga(r);
      return '- ' + r.nome + ' (' + fmtN(qtaRiga(r)) + (u ? ' ' + u : '') + ')';
    }).join('\n');
    const ta = $('ta');
    try { await navigator.clipboard.writeText(testo); $('copia').textContent = 'Copiata ✓'; setTimeout(() => $('copia').textContent = 'Copia per Note', 1800); }
    catch (e) { ta.value = testo; ta.hidden = false; ta.select(); }
  });

  if (!window.firebase) {
    stato.dispensa = stato.casa = { s: 'errore', msg: 'Firebase non caricato' };
    render();
  } else {
    render();
    avvia('dispensa'); avvia('casa');
  }
})();
</script>
</body>
</html>
